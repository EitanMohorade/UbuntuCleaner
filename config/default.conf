# config/default.conf — valores por defecto
# Este archivo está versionado. NO editar directamente.
# Para personalizar, sobrescribí variables en config/user.conf

# ── Retención ────────────────────────────────────────────────
LOG_DAYS=7              # Días de logs de systemd a conservar
TMP_DAYS=1              # Antigüedad mínima (mtime) para limpiar /tmp
CACHE_DAYS=30           # Antigüedad mínima (mtime) de caché de usuario

# ── Módulos activos por defecto ───────────────────────────────
# El entrypoint usa esto si no se pasa --only ni --skip
MODULES_DEFAULT="apt cleanup integrity disk"

# ── Features ─────────────────────────────────────────────────
ENABLE_SNAP_CLEANUP=true   # Eliminar versiones antiguas de snap
ENABLE_FSCK=true           # Programar chequeo de disco
ENABLE_DEBSUMS=true        # Verificar integridad con debsums

# ── Estrategia de logs del sistema ───────────────────────────
# false → solo journalctl (recomendado para desktop)
# true  → logrotate -f /etc/logrotate.conf (mejor para servidor,
#          respeta las políticas de rotación por paquete)
ENABLE_LOGROTATE=false

# ── Exclusiones de caché de usuario ──────────────────────────
# Rutas relativas a ~/.cache/ que NO se limpian.
# Los navegadores manejan su propia invalidación de caché;
# borrar selectivamente puede corromper sus índices internos.
CACHE_EXCLUDE_PATHS=".cache/mozilla .cache/google-chrome .cache/chromium .cache/BraveSoftware .cache/ms-edge"

# ── Logs del propio script ────────────────────────────────────
SCRIPT_LOG_KEEP_DAYS=30    # Días de logs del script a conservar

# ── Módulo dev ────────────────────────────────────────────────
# Volúmenes Docker: DESACTIVADO por defecto porque es DESTRUCTIVO.
# Activar solo si estás seguro de que no hay datos persistentes
# en volúmenes sin nombre (anónimos).
ENABLE_DOCKER_VOLUME_PRUNE=false
