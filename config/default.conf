# Valores por defecto del proyecto.
# No editar aqui: usar config/user.conf para sobrescribir.

# Retencion.
LOG_DAYS=7              # Días de logs de systemd a conservar
TMP_DAYS=1              # Antigüedad mínima (mtime) para limpiar /tmp
CACHE_DAYS=30           # Antigüedad mínima (mtime) de caché de usuario

# Modulos por defecto si no se usan --only/--skip.
MODULES_DEFAULT="apt cleanup integrity disk"

# Features.
ENABLE_SNAP_CLEANUP=true   # Eliminar versiones antiguas de snap
ENABLE_FSCK=true           # Programar chequeo de disco
ENABLE_DEBSUMS=true        # Verificar integridad con debsums

# Estrategia de logs del sistema.
# false: solo journalctl.
# true: logrotate -f /etc/logrotate.conf.
ENABLE_LOGROTATE=false

# Rutas relativas a ~/.cache/ que no se limpian.
CACHE_EXCLUDE_PATHS=".cache/mozilla .cache/google-chrome .cache/chromium .cache/BraveSoftware .cache/ms-edge"

# Retencion de logs del propio script.
SCRIPT_LOG_KEEP_DAYS=30    # Días de logs del script a conservar
